databases:
  - name: eclat-db
    plan: free
    databaseName: eclat
    user: eclat

services:
  - type: web
    name: eclat-store
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn one8_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eclat-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false