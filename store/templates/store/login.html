{% extends 'store/base.html' %}
{% block content %}
<div class="container" style="max-width:480px;">
  <h1 class="section-title" style="font-size:36px;">Welcome <em>Back</em></h1>
  <p class="section-sub">Sign in to your account</p>

  <form method="post" style="display:flex;flex-direction:column;gap:18px;">
    {% csrf_token %}
    <input name="username" placeholder="Username" required
           style="padding:14px 18px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:14px;">
    <input name="password" type="password" placeholder="Password" required
           style="padding:14px 18px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:14px;">
    <button type="submit" class="btn">Log In</button>
  </form>

  <p style="text-align:center;margin-top:24px;font-size:13px;color:var(--muted);">
    New here? <a href="{% url 'store:register' %}" style="color:var(--gold);">Create an account</a>
  </p>
</div>
{% endblock %}
